<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bel ons</title>
<style>
  :root{--bg:#eef1f8;--kaart:#fff;--tekst:#0f172a;--zacht:#64748b;--knop:#15803d}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tekst);margin:0;padding:32px 16px}
  main{max-width:420px;margin:0 auto;background:var(--kaart);border-radius:14px;padding:28px 24px;box-shadow:0 1px 3px rgba(0,0,0,.08);text-align:center}
  h1{font-size:22px;margin:0 0 6px}
  .nummer{font-size:30px;font-weight:700;margin:14px 0 20px;letter-spacing:.5px}
  a.knop{display:block;background:var(--knop);color:#fff;text-decoration:none;font-size:20px;font-weight:600;padding:16px;border-radius:12px}
  p{line-height:1.5;margin:16px 0 0;color:var(--zacht);font-size:15px}
</style>
</head>
<body>
<main>
  <h1 id="winkel">Woonboulevard Wijchen</h1>
  <div class="nummer" id="nummer">024 649 1149</div>
  <a class="knop" id="knop" href="tel:+31246491149">Nu bellen</a>
  <p>Wij zijn telefonisch bereikbaar van maandag tot en met vrijdag van 9:00 tot 17:00.</p>
</main>
<script>
// Alleen vaste nummers: de pagina belt nooit een nummer uit de link zelf.
var WINKELS = {
  wbw:        {naam: 'Woonboulevard Wijchen', nummer: '024 649 1149', tel: '+31246491149'},
  oosterbaan: {naam: 'Oosterbaan Living',     nummer: '024 345 46 47', tel: '+31243454647'},
  zen:        {naam: 'Zen Lifestyle',         nummer: '024 645 48 45', tel: '+31246454845'},
  woonoutlet: {naam: 'Woonoutlet',            nummer: '024 870 01 77', tel: '+31248700177'}
};
var w = new URLSearchParams(location.search).get('w') || 'wbw';
var winkel = WINKELS[w] || WINKELS.wbw;
document.getElementById('winkel').textContent = winkel.naam;
document.getElementById('nummer').textContent = winkel.nummer;
document.getElementById('knop').href = 'tel:' + winkel.tel;
document.title = 'Bel ' + winkel.naam;
// Op een telefoon meteen de bel-app openen; op de computer alleen het nummer tonen.
if (window.matchMedia('(pointer: coarse)').matches) {
  setTimeout(function(){ location.href = 'tel:' + winkel.tel; }, 300);
}
</script>
</body>
</html>
